<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QWARDDLE v0.0.22</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="game" class="inactive"></canvas>

  <div id="menu" class="screenLayer">
    <main class="simpleMenu">
      <section class="menuLeft">
        <div class="menuTitle">QWARDDLE</div>
        <label class="nicknameField">
          <span>NICKNAME</span>
          <input id="nicknameInput" type="text" maxlength="16" autocomplete="off" spellcheck="false" value="QWARD" />
        </label>
        <button id="playBtn" class="bigButton" data-i18n="ui.menu.play">PLAY</button>
      </section>
      <section class="demoPanel"><canvas id="menuDemo"></canvas></section>
    </main>
  </div>

  <div id="modeScreen" class="screenLayer hidden">
    <main class="simpleScreen">
      <h1 data-i18n="ui.mode.title">PLAY</h1>
      <section class="modeGrid">
        <button id="singleBtn" class="modeCard available" data-i18n="ui.mode.solo">SOLO</button>
        <button id="localBtn" class="modeCard available" data-i18n="ui.mode.local">LOCAL</button>
        <button class="modeCard" disabled data-i18n="ui.mode.online">ONLINE</button>
      </section>
    </main>
  </div>

  <div id="localScreen" class="screenLayer hidden">
    <main class="simpleScreen">
      <h1>LOCAL</h1>
      <section class="localChoiceGrid">
        <button id="couchBtn" class="modeCard available">COUCH</button>
        <button id="lanBtn" class="modeCard available">LAN</button>
      </section>
      <p class="screenHint">COUCH uses one computer + controller. LAN uses two computers on the same network.</p>
    </main>
  </div>

  <div id="lanScreen" class="screenLayer hidden">
    <main class="lanShell">
      <header class="setupTop">
        <h1>LAN</h1>
        <button id="lanRefreshBtn" class="continueButton">REFRESH</button>
      </header>

      <section class="lanColumns">
        <section class="lanPanel">
          <h2>HOST GAME</h2>
          <label>ROOM NAME<input id="lanRoomName" maxlength="28" autocomplete="off" /></label>
          <label>PASSWORD <small>OPTIONAL</small><input id="lanHostPassword" maxlength="32" type="password" autocomplete="off" /></label>
          <button id="lanHostBtn" class="bigButton lanAction">HOST</button>
          <div id="lanHostStatus" class="lanStatus"></div>
        </section>

        <section class="lanPanel">
          <h2>JOIN GAME</h2>
          <label>PASSWORD <small>IF NEEDED</small><input id="lanJoinPassword" maxlength="32" type="password" autocomplete="off" /></label>
          <div id="lanRoomList" class="lanRoomList"></div>
          <div id="lanJoinStatus" class="lanStatus"></div>
        </section>
      </section>

      <p class="screenHint">Run <b>py lan_server.py</b> on the host, then open its printed LAN address on the second computer.</p>
    </main>
  </div>

  <div id="lanClientScreen" class="screenLayer hidden lanClientLayer">
    <video id="lanVideo" class="lanVideo" autoplay playsinline muted></video>
    <div class="lanClientHud">
      <span id="lanClientStatus">CONNECTING...</span>
      <span>WASD + MOUSE / LMB / Q / E</span>
    </div>
  </div>

  <div id="mapScreen" class="screenLayer hidden">
    <main class="mapShell">
      <header class="setupTop">
        <h1 data-i18n="ui.maps.title">MAP</h1>
        <button id="mapContinueBtn" class="continueButton" data-i18n="ui.maps.continue">CONTINUE</button>
      </header>
      <section id="mapItems" class="mapGrid"></section>
    </main>
  </div>

  <div id="customScreen" class="screenLayer hidden">
    <main class="customShell">
      <header class="customTop">
        <h1 data-i18n="ui.customize.title">CUSTOMIZE</h1>
        <button id="continueBtn" class="continueButton" data-i18n="ui.customize.continue">FIGHT</button>
      </header>

      <section class="customBody">
        <nav class="customTabs" aria-label="Customization categories">
          <button class="customTab active" data-tab="weapon" data-i18n="ui.customize.weapons">WEAPONS</button>
          <button class="customTab" data-tab="color" data-i18n="ui.customize.colors">COLORS</button>
          <button id="fighterSwitchBtn" class="customTab customFighterSwitch hidden" type="button">EDIT P2</button>
        </nav>

        <section class="customControls">
          <section id="customItems" class="customItems"></section>
          <aside id="weaponInfo" class="weaponInfo hidden"></aside>
        </section>

        <section class="customPreview"><canvas id="customDemo"></canvas></section>
      </section>
    </main>
  </div>

  <script src="src/utils.js"></script>
  <script src="src/config.js"></script>
  <script src="src/input/KeyboardInput.js"></script>
  <script src="src/input/PointerInput.js"></script>
  <script src="src/input/FighterController.js"></script>
  <script src="src/net/LanPeer.js"></script>
  <script src="src/world/MapRegistry.js"></script>
  <script src="src/world/Terrain.js"></script>
  <script src="src/player/ProceduralLeg.js"></script>
  <script src="src/player/ActiveBodySupport.js"></script>
  <script src="src/player/FloatingHand.js"></script>
  <script src="src/player/ProceduralArm.js"></script>
  <script src="src/combat/Balance.js"></script>
  <script src="src/combat/Weapon.js"></script>
  <script src="src/combat/Projectile.js"></script>
  <script src="src/combat/ProjectileSystem.js"></script>
  <script src="src/combat/WeaponMount.js"></script>
  <script src="src/combat/Revolver.js"></script>
  <script src="src/combat/Wand.js"></script>
  <script src="src/combat/Sake.js"></script>
  <script src="src/combat/Dagger.js"></script>
  <script src="src/combat/WeaponRegistry.js"></script>
  <script src="src/player/Player.js"></script>
  <script src="src/actors/Ragdoll.js"></script>
  <script src="src/game/FighterSlot.js"></script>
  <script src="src/game/RoundManager.js"></script>
  <script src="src/game/CameraEffects.js"></script>
  <script src="src/game/MenuDemo.js"></script>
  <script src="src/game/Language.js"></script>
  <script src="src/game/MapSelectionScreen.js"></script>
  <script src="src/game/CustomizationScreen.js"></script>
  <script src="src/game/Game.js"></script>
  <script src="src/game/App.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
